name: Production CD

on:
  push:
    branches: [master]

jobs:
  Build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Generate .env
        run: |
          envsubst "`printf '${%s} ' $(sh -c "env|cut -d'=' -f1")`" < ./environments/example.env > ./environments/$NODE_ENV.env
        env:
          PORT: 5011
          NODE_ENV: production
          APP_IDENTIFIER: commanddesk-production
          APP_TITLE: Command Desk
          API_PREFIX: api/v1
          TZ: UTC

          # Swagger
          API_VERSION: 1.0.0
          API_TITLE: Command Desk API PRODUCTION
          API_DESCRIPTION: Command Desk API, the core api distributor for Quicksoft ltd & it's concerns ( PRODUCTION )

          # Default DB
          DB_TYPE: postgres
          DB_HOST: ${{ secrets.PRODUCTION_HOST }}
          DB_PORT: 5432
          DB_USERNAME: ${{ secrets.PRODUCTION_POSTGRES_USER }}
          DB_PASSWORD: ${{ secrets.PRODUCTION_POSTGRES_PASS }}
          DB_DATABASE: secure-command-desk_db
          DB_SYNCHRONIZE: true
          DB_LOGGING: false

          # Security
          CORS_ALLOWED_ORIGINS: https://command-desk.quicksoftitltd.workers.dev,https://commanddesk-api.quicksoftltd.com,https://commanddesk.quicksoftltd.com
          RATE_LIMIT_TTL: 60000
          RATE_LIMIT_MAX: 100

          # Logger
          LOG_FOLDER: logs

          # JWT
          JWT_SECRET: ssh-rsa AAAAB3NzaC1yc2EAAAdwADAQABAAwdwwABAQfC8kf3x3Wi9V3kMkYu9tjDwdwaSRD2cBjOgp3FQwdwU/Gndlced9WsaVNx3lgkbbS47sPpFMdQVSgemGbRqhaj9vUrD56+QOMn5HuxeAp5VMwwD$
          JWT_SALT_ROUNDS: 10
          JWT_EXPIRES_IN: 10d
          JWT_REFRESH_TOKEN_EXPIRES_IN: 30d

          # Auth
          OTP_EXPIRES_IN: 5000

          INTERNAL_PANEL_LOGIN_LINK: https://commanddesk.quicksoftltd.com/auth

          CORE_API_ENDPOINT: https://commanddesk-api.quicksoftltd.com/api/v1
          WEB_URL: https://commanddesk.quicksoftltd.com

          # Seed Database
          SUPER_ADMIN_EMAIL: superadmin@quicksoftltd.com
          SUPER_ADMIN_PASSWORD: super@QuickSoft

          #QUEUE
          QUEUE_HOST: redis
          QUEUE_PORT: 6379
          QUEUE_PASSWORD: 'PiTech.domanaged#redis'

          # Cache
          CACHE_API_DATA: false
          CACHE_TTL: 60
          CACHE_MAX: 100
          CACHE_STORE_HOST: redis
          CACHE_STORE_PORT: 6379
          CACHE_STORE_PASSWORD: 'PiTech.domanaged#redis'
          CACHE_STORE_USERNAME: default

          #SMTP
          SMTP_HOST: smtp-relay.brevo.com
          SMTP_PORT: 2525
          SMTP_SECURE: false
          SMTP_AUTH_USER: 7b8634001@smtp-brevo.com
          SMTP_AUTH_PASS: r4HCV8GL7ywhP9BX
          SMTP_EMAIL: info@quicksoftltd.com

          # SYSTEM CONFIG
          IS_STUFF_AUTH_VERIFICATION_REQUIRED: true

      - name: Set up Node.js
        uses: actions/setup-node@v6

      - name: Install dependencies
        run: yarn install --ignore-scripts

      - name: Build the project
        run: yarn run build
        env:
          CI: false

      - name: Deploy Files to Server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_SERVER_USERNAME }}
          key: ${{ secrets.PRODUCTION_SERVER_SSH_PRIVATE_KEY }}
          rm: true
          source: './' # This will send all files, including the build directory
          target: '/home/pitech/deployed-services/commanddesk-api-prod/' # This will send all files, including the build directory
          strip_components: 0

  deploy-commanddesk-api-prod-to-DO:
    needs: Build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy api to DigitalOcean Droplet
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_SERVER_USERNAME }}
          key: ${{ secrets.PRODUCTION_SERVER_SSH_PRIVATE_KEY }}
          port: 22
          script: |
            cd /home/pitech/deployed-services/commanddesk-api-prod/
            echo "calling shutdown endpoint..."
            docker stop commanddesk-api-prod || true
            docker rm commanddesk-api-prod || true

            echo "Building the image..."
            docker build -t commanddesk-api-prod:local -f /home/pitech/deployed-services/commanddesk-api-prod/Dockerfile.prod .

            echo "starting server instance..."
            docker run -e NODE_ENV=production -d \
              --restart always \
              -dit --name commanddesk-api-prod --network docker_docker_net \
              -p 0.0.0.0:5011:5011 \
              --name commanddesk-api-prod \
              -v /home/pitech/deployed-services/commanddesk-api-prod/dist:/app/dist \
              commanddesk-api-prod:local

            docker builder prune -f
            docker image prune -f
            echo "Deploy Done...."
